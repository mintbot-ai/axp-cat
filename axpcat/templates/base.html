<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}axp.cat{% endblock %}</title>
<meta name="description" content="{% block description %}The Agent Extension Protocol (AXP): one signed manifest to describe, install, update and verify agent extensions on any runtime - and the open catalog of packages that pass the standard.{% endblock %}">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="axp.cat home">
    <svg class="logo" viewBox="0 0 72 64" aria-hidden="true" focusable="false">
      <path class="body" d="M6 20 L10 4 L26 14 H38 L54 4 L58 20 V48 a12 12 0 0 1 -12 12 H18 a12 12 0 0 1 -12 -12 Z"/>
      <path class="tail" d="M58 42 c9 1 11 11 2 15"/>
      <text class="face" x="32" y="45" text-anchor="middle">AXP</text>
    </svg>
    <span class="wordmark">axp<span class="cat">.cat</span></span>
  </a>
  <nav>
    <a href="/catalog">Catalog</a>
    <a href="/submit">Submit a package</a>
    <a href="{{ site.spec_url }}">Specification</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>axp.cat is the public home of the <a href="{{ site.spec_repo_url }}">Agent Extension Protocol</a>, an open standard published under the MIT licence and run by <a href="https://mintbot.ai/">mintbot.ai</a>. Site source: <a href="{{ site.site_repo_url }}">mintbot-ai/axp-cat</a> &middot; machine-readable catalog: <a href="/api/catalog.json">/api/catalog.json</a></p>
</footer>
</body>
</html>
