<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Extension Protocol{% endblock %}</title>
<meta name="description" content="{% block description %}The Agent Extension Protocol (AXP): one signed manifest to describe, install, update and verify agent extensions on any runtime - and the open catalog of packages that pass the standard.{% endblock %}">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="axp.cat home">
    <svg class="logo" viewBox="0 0 72 64" aria-hidden="true" focusable="false">
      <path class="head" d="M6 32 L10 6 L26 18 H46 L62 6 L66 32 V42 C66 55 53 62 36 62 C19 62 6 55 6 42 Z"/>
      <text class="face" x="36" y="49" text-anchor="middle">AXP</text>
    </svg>
    <span class="wordmark">axp<span class="cat">.cat</span></span>
  </a>
  <nav>
    <a href="/catalog">Catalog</a>
    <a href="/submit">Submit a package</a>
    <a href="{{ site.spec_url }}">Specification</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <p>The Agent Extension Protocol is an open standard under the MIT licence, maintained by <a href="https://mintbot.ai/">mintbot.ai</a>.</p>
  <nav aria-label="Footer">
    <a href="{{ site.spec_repo_url }}">Specification source</a>
    <a href="{{ site.site_repo_url }}">Site source</a>
    <a href="/api/catalog.json">Catalog API (JSON)</a>
  </nav>
</footer>
</body>
</html>
